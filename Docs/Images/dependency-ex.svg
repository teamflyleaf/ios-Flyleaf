<svg width="820" height="460" viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="820" height="460" fill="#ffffff"/>

  <!-- Layer labels -->
  <text x="14" y="68" font-size="11" fill="#aaaaaa">App</text>
  <text x="14" y="178" font-size="11" fill="#aaaaaa">Implementation</text>
  <text x="14" y="298" font-size="11" fill="#aaaaaa">Interface</text>
  <text x="14" y="418" font-size="11" fill="#aaaaaa">Foundation</text>

  <!-- Horizontal dividers -->
  <line x1="110" y1="110" x2="810" y2="110" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="110" y1="230" x2="810" y2="230" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="110" y1="350" x2="810" y2="350" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ===== BOXES ===== -->

  <!-- Row 1: App -->
  <rect x="330" y="30" width="160" height="50" rx="6" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.5"/>
  <text x="410" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">App</text>

  <!-- Row 2: Feature, ServiceImplementation, DIContainer -->
  <rect x="130" y="140" width="160" height="50" rx="6" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.5"/>
  <text x="210" y="170" text-anchor="middle" font-size="13" fill="#333333">Feature</text>

  <rect x="330" y="140" width="200" height="50" rx="6" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.5"/>
  <text x="430" y="163" text-anchor="middle" font-size="13" fill="#333333">Service</text>
  <text x="430" y="180" text-anchor="middle" font-size="13" fill="#333333">Implementation</text>

  <rect x="570" y="140" width="160" height="50" rx="6" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.5"/>
  <text x="650" y="170" text-anchor="middle" font-size="13" fill="#333333">DIContainer</text>

  <!-- Row 3: FeatureInterface, ServiceInterface -->
  <rect x="130" y="260" width="180" height="50" rx="6" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.5"/>
  <text x="220" y="283" text-anchor="middle" font-size="13" fill="#333333">Feature</text>
  <text x="220" y="300" text-anchor="middle" font-size="13" fill="#333333">Interface</text>

  <rect x="360" y="260" width="180" height="50" rx="6" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.5"/>
  <text x="450" y="283" text-anchor="middle" font-size="13" fill="#333333">Service</text>
  <text x="450" y="300" text-anchor="middle" font-size="13" fill="#333333">Interface</text>

  <!-- Row 4: Core, DesignSystem -->
  <rect x="200" y="380" width="160" height="50" rx="6" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.5"/>
  <text x="280" y="410" text-anchor="middle" font-size="13" fill="#333333">Core</text>

  <rect x="420" y="380" width="160" height="50" rx="6" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.5"/>
  <text x="500" y="410" text-anchor="middle" font-size="13" fill="#333333">DesignSystem</text>

  <!-- ===== ARROWS ===== -->
  <!-- marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888888"/>
    </marker>
  </defs>

  <!-- App → Feature -->
  <line x1="370" y1="80" x2="240" y2="138" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- App → ServiceImplementation -->
  <line x1="410" y1="80" x2="430" y2="138" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- App → DIContainer -->
  <line x1="455" y1="80" x2="620" y2="138" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Feature → FeatureInterface -->
  <line x1="210" y1="190" x2="214" y2="258" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Feature → ServiceInterface -->
  <line x1="250" y1="185" x2="390" y2="258" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Feature → Core -->
  <line x1="180" y1="190" x2="265" y2="378" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Feature → DesignSystem -->
  <line x1="220" y1="190" x2="465" y2="378" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ServiceImplementation → ServiceInterface -->
  <line x1="430" y1="190" x2="446" y2="258" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ServiceInterface → Core -->
  <line x1="410" y1="310" x2="320" y2="378" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow)"/>

</svg>
